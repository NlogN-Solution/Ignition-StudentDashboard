<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The Ignition mark, the same artwork the public platform serves from
         Ignition-Landing/app/icon.png and the staff console serves from
         admin-frontend/public. One product, one tab icon: a student with the
         public site and the portal open side by side should not have to read
         the tab titles to tell them apart. The .ico carries hand-tuned 16/32/48
         bitmaps; the 512 PNG is what high-DPI tabs and installs pick up. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="theme-color" content="#01166f" />
    <meta
      name="description"
      content="Your Ignition student portal — profile, documents, applications and visa, all in one place."
    />

    <!-- Plus Jakarta Sans is Ignition's typeface, shared with the public
         platform so the portal reads as the same product. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Ignition — Your UK application</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
